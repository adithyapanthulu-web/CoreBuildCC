services:
  - type: web
    name: corebuildcc
    runtime: python
    buildCommand: pip install -r src/requirements.txt
    startCommand: cd src && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: COREBUILD_DATA_DIR
        value: /var/data
      - key: CORE_BUILD_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: corebuild-data
      mountPath: /var/data
      sizeGB: 1
